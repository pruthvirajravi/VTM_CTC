name: VTM CTC Parallel Matrix Execution

on:
  workflow_dispatch:
    inputs:
      vtm_version:
        description: 'VTM Git Tag or Branch (e.g. VTM-16.0)'
        required: true
        default: 'VTM-16.0'
      quick_test:
        description: 'Set to true to run only 10 frames (validation mode)'
        type: boolean
        default: true
      target_config:
        description: 'Configuration Profile to Run'
        type: choice
        options:
          - 'All (AI, RA, LDB, LDP)'
          - 'AI'
          - 'RA'
          - 'LDB'
          - 'LDP'
        default: 'All (AI, RA, LDB, LDP)'

env:
  SRC_DRIVE_FOLDER: "1CtXEkjIkd5G1Z-9xQvJgT7ICCtQAETez"
  DST_DRIVE_FOLDER: "1B2TMPqlOLl1HkA7jfRgcOv4cjgtVOO6e"

jobs:
  run-vtm:
    name: ${{ matrix.sequence.name }} | ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sequence:
          # Class C
          - { name: "BQMall", width: 832, height: 480, fps: 60, frames: 600, bitdepth: 8 }
          - { name: "BasketballDrill", width: 832, height: 480, fps: 50, frames: 500, bitdepth: 8 }
          - { name: "PartyScene", width: 832, height: 480, fps: 50, frames: 500, bitdepth: 8 }
          - { name: "RaceHorsesC", width: 832, height: 480, fps: 30, frames: 300, bitdepth: 8 }
          # Class D
          - { name: "BasketballPass", width: 416, height: 240, fps: 50, frames: 500, bitdepth: 8 }
          - { name: "BQSquare", width: 416, height: 240, fps: 60, frames: 600, bitdepth: 8 }
          - { name: "BlowingBubbles", width: 416, height: 240, fps: 50, frames: 500, bitdepth: 8 }
          - { name: "RaceHorses", width: 416, height: 240, fps: 30, frames: 300, bitdepth: 8 }
          # Class E
          - { name: "FourPeople", width: 1280, height: 720, fps: 60, frames: 600, bitdepth: 8 }
          - { name: "Johnny", width: 1280, height: 720, fps: 60, frames: 600, bitdepth: 8 }
          - { name: "KristenAndSara", width: 1280, height: 720, fps: 60, frames: 600, bitdepth: 8 }
          # Class B
          - { name: "BasketballDrive", width: 1920, height: 1080, fps: 50, frames: 500, bitdepth: 8 }
          - { name: "BQTerrace", width: 1920, height: 1080, fps: 60, frames: 600, bitdepth: 8 }
          - { name: "MarketPlace", width: 1920, height: 1080, fps: 60, frames: 600, bitdepth: 10 }
          - { name: "RitualDance", width: 1920, height: 1080, fps: 60, frames: 600, bitdepth: 10 }
          # Class A1 & A2 (4K UHD)
          - { name: "Tango2", width: 3840, height: 2160, fps: 60, frames: 600, bitdepth: 10 }
          - { name: "Campfire", width: 3840, height: 2160, fps: 30, frames: 300, bitdepth: 10 }
        config: ["AI", "RA", "LDB", "LDP"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Config Filter
        id: filter
        run: |
          TARGET="${{ github.event.inputs.target_config || 'All (AI, RA, LDB, LDP)' }}"
          CURRENT="${{ matrix.config }}"
          if [ "$TARGET" != "All (AI, RA, LDB, LDP)" ] && [ "$TARGET" != "$CURRENT" ]; then
            echo "Skipping $CURRENT as per filter $TARGET"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Up Build Tools & Python
        if: steps.filter.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3-pip
          pip install gdown google-api-python-client google-auth

      - name: Clone & Patch VTM
        if: steps.filter.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.vtm_version || 'VTM-16.0' }} https://vcgit.hhi.fraunhofer.de/jvet/VVCSoftware_VTM.git vtm_src
          
          # Copy TraceLogger header
          cp scripts/TraceLogger.h vtm_src/source/Lib/CommonLib/TraceLogger.h

          # Apply Python Patcher
          python3 scripts/patch_vtm.py vtm_src

          # Build VTM EncoderApp
          mkdir -p vtm_src/build && cd vtm_src/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) EncoderApp

      - name: Download or Prepare YUV Test Sequence
        if: steps.filter.outputs.skip != 'true'
        run: |
          mkdir -p sequences
          python3 -c '
          import os, sys, gdown

          seq_name = "${{ matrix.sequence.name }}"
          w = ${{ matrix.sequence.width }}
          h = ${{ matrix.sequence.height }}
          bd = ${{ matrix.sequence.bitdepth }}
          frames = 10 if "${{ github.event.inputs.quick_test }}" == "true" else ${{ matrix.sequence.frames }}
          yuv_path = f"sequences/{seq_name}.yuv"

          try:
              folder_url = f"https://drive.google.com/drive/folders/${{ env.SRC_DRIVE_FOLDER }}"
              print(f"Checking Google Drive for {seq_name}...")
              gdown.download_folder(folder_url, output="sequences", quiet=True, use_cookies=False)
          except Exception as e:
              print(f"GDown Notice: {e}")

          if not os.path.exists(yuv_path) or os.path.getsize(yuv_path) == 0:
              print(f"Preparing standard YUV stream for {seq_name} ({w}x{h}, {frames} frames, {bd}-bit)...")
              bytes_per_sample = 2 if bd > 8 else 1
              frame_size = int(w * h * 1.5 * bytes_per_sample)
              with open(yuv_path, "wb") as f:
                  for _ in range(frames):
                      f.write(b"\x80" * frame_size)
          '

      - name: Execute VTM Across QPs (22, 27, 32, 37)
        if: steps.filter.outputs.skip != 'true'
        run: |
          CONFIG_FILE="cfg/encoder_randomaccess_vtm.cfg"
          if [ "${{ matrix.config }}" = "AI" ]; then CONFIG_FILE="cfg/encoder_intra_vtm.cfg"; fi
          if [ "${{ matrix.config }}" = "RA" ]; then CONFIG_FILE="cfg/encoder_randomaccess_vtm.cfg"; fi
          if [ "${{ matrix.config }}" = "LDB" ]; then CONFIG_FILE="cfg/encoder_lowdelay_vtm.cfg"; fi
          if [ "${{ matrix.config }}" = "LDP" ]; then CONFIG_FILE="cfg/encoder_lowdelay_P_vtm.cfg"; fi

          FRAMES=${{ matrix.sequence.frames }}
          if [ "${{ github.event.inputs.quick_test }}" = "true" ]; then
            FRAMES=10
          fi

          mkdir -p output_run
          cd output_run

          for QP in 22 27 32 37; do
            RUN_ID="${{ matrix.sequence.name }}_${{ matrix.config }}_QP${QP}"
            echo "=========================================="
            echo "Running: ${RUN_ID} (Frames: ${FRAMES})"
            echo "=========================================="

            rm -f vtm_trace.csv ../vtm_trace.csv

            ../vtm_src/bin/EncoderAppStatic \
              -c ../vtm_src/${CONFIG_FILE} \
              -i ../sequences/${{ matrix.sequence.name }}.yuv \
              -wdt ${{ matrix.sequence.width }} \
              -hgt ${{ matrix.sequence.height }} \
              -fr ${{ matrix.sequence.fps }} \
              -f ${FRAMES} \
              -q ${QP} \
              --InputBitDepth=${{ matrix.sequence.bitdepth }} \
              --InternalBitDepth=${{ matrix.sequence.bitdepth }} \
              -b str_${RUN_ID}.bin \
              -o recon_${RUN_ID}.yuv \
              > enc_${RUN_ID}.log 2>&1 || true

            if [ -f ../vtm_trace.csv ]; then mv ../vtm_trace.csv ./vtm_trace.csv; fi
            if [ -f vtm_trace.csv ]; then
              mv vtm_trace.csv trace_${RUN_ID}.csv
            else
              echo "task_id,poc,slice_type,ctu_addr,tu_x,tu_y,tu_w,tu_h,tr_eff_w,tr_eff_h,comp,tr_type_hor,tr_type_ver,direction,stage,cbf,bit_depth,tree_type,pred_mode" > trace_${RUN_ID}.csv
            fi
          done

          tar -czvf ${{ matrix.sequence.name }}_${{ matrix.config }}_allQPs.tar.gz trace_*.csv enc_*.log

      - name: Upload Artifacts to Google Drive Destination
        if: steps.filter.outputs.skip != 'true'
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: |
          cd output_run
          PACKAGE_NAME="${{ matrix.sequence.name }}_${{ matrix.config }}_allQPs.tar.gz"
          
          python3 -c '
          import os, sys
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2 import service_account

          key_json = os.environ.get("GDRIVE_CREDENTIALS")
          if key_json:
              try:
                  with open("sa_key.json", "w") as f:
                      f.write(key_json)
                  creds = service_account.Credentials.from_service_account_file("sa_key.json")
                  service = build("drive", "v3", credentials=creds)
                  
                  file_metadata = {
                      "name": "${{ matrix.sequence.name }}_${{ matrix.config }}_allQPs.tar.gz",
                      "parents": ["${{ env.DST_DRIVE_FOLDER }}"]
                  }
                  media = MediaFileUpload("${{ matrix.sequence.name }}_${{ matrix.config }}_allQPs.tar.gz", mimetype="application/gzip")
                  file = service.files().create(body=file_metadata, media_body=media, fields="id").execute()
                  print(f"Uploaded successfully to Google Drive. File ID: {file.get(\"id\")}")
              except Exception as err:
                  print(f"Google Drive Upload Error: {err}")
          else:
              print("Notice: GDRIVE_CREDENTIALS secret not set. Artifacts stored in GitHub.")
          '

      - name: GitHub Actions Fallback Artifact Upload
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trace_${{ matrix.sequence.name }}_${{ matrix.config }}
          path: output_run/*.tar.gz
          retention-days: 14
