name: VTM Verified Genuine-Video Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-vtm-pilot
  cancel-in-progress: false

jobs:
  verified-pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      VTM_COMMIT: 3711eda2cff4777b28b3338d6bc4783424fc6d30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-11 g++-11
          python -m pip install numpy==1.26.4 gdown==5.2.0
      - name: Obtain pinned official VTM source
        run: |
          git clone --depth 1 --branch VTM-18.0 https://vcgit.hhi.fraunhofer.de/jvet/VVCSoftware_VTM.git vtm_src
          test "$(git -C vtm_src rev-parse HEAD)" = "$VTM_COMMIT"
      - name: Validate collection helpers
        run: python -m unittest discover -s scripts -p test_verified_collection.py -v
      - name: Build uninstrumented encoder control
        run: |
          cmake -S vtm_src -B vtm_src/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11 '-DCMAKE_CXX_FLAGS=-DRExt__HIGH_BIT_DEPTH_SUPPORT=0 -DRExt__HIGH_PRECISION_FORWARD_TRANSFORM=0'
          cmake --build vtm_src/build --target EncoderApp DecoderApp --parallel 4
          mkdir -p binaries
          cp vtm_src/bin/EncoderAppStatic binaries/EncoderAppBaseline
      - name: Apply checked arithmetic and final-TU hooks
        run: python scripts/patch_verified_vtm.py vtm_src
      - name: Build instrumented encoder and decoder
        run: |
          cmake --build vtm_src/build --target EncoderApp DecoderApp --parallel 4
          cp vtm_src/bin/EncoderAppStatic binaries/EncoderAppTraced
          cp vtm_src/bin/DecoderAppStatic binaries/DecoderAppTraced
      - name: Run genuine-video pilot and verify exact results
        run: |
          python scripts/run_verified_pilot.py --baseline "$PWD/binaries/EncoderAppBaseline" --encoder "$PWD/binaries/EncoderAppTraced" --decoder "$PWD/binaries/DecoderAppTraced" --vtm "$PWD/vtm_src"
      - name: Preserve diagnostics even if validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-vtm-pilot-${{ github.run_id }}
          path: |
            verified_results/
            vtm_src/trace_patch_manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish validation summary
        if: success()
        run: |
          echo '## Genuine-video VTM pilot passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'BasketballPass: AI QP22/37 (2 frames each); LDP/LDB/RA QP32 (8 frames each).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bitstream neutrality, decoded reconstruction, complete frame counts and sampled dense-matrix transform checks passed. This is a pilot, not full CTC coverage.' >> "$GITHUB_STEP_SUMMARY"
