name: VTM Heavy CTC - Awaiting Verified Sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  require-authentic-inputs:
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse synthetic substitutes for named CTC sequences
        run: |
          echo '::error::The previous heavy workflow generated synthetic frames and named them Tango2/Campfire/MarketPlace/RitualDance. Those runs are not CTC measurements. Supply verified original inputs and manifests before restoring this campaign. Use the verified genuine-video pilot for pipeline validation.'
          exit 1
